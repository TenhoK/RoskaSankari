<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Roskasankari</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <img id="logo" src="assets/images/RoskaSankari.png" alt="Roskasankari logo">

    <button id="startBtn">
        <img src="assets/images/Aloita.png" alt="Aloita peli"> <!-- ALOITA BUTTON -->
    </button>
    <div id="bins" hidden> <!-- ROSKIKSET -->
        <img class="bin" data-tyyppi="Bio" src="assets/images/bio_bin.png" alt="Bio">
        <img class="bin" data-tyyppi="Metalli" src="assets/images/metal_bin.png" alt="Metalli">
        <img class="bin" data-tyyppi="Muovi" src="assets/images/plastic_bin.png" alt="Muovi">
        <img class="bin" data-tyyppi="Kartonki" src="assets/images/paper_bin.png" alt="Kartonki">
        <img class="bin" data-tyyppi="Lasi" src="assets/images/glass_bin.png" alt="Lasi">
    </div>

    <div id="hud" hidden>
        Pisteet: <span id="score">0</span>
        <button id="pauseBtn">
            <img src="assets/images/Tauko.png" alt="Tauko">
        </button>
    </div>

    <div id="pauseMenu" hidden> <!-- TAUKOVALIKKO -->
        <button id="resumeBtn">
            <img src="assets/images/Jatka.png" alt="Jatka peliä">
        </button>
        <button id="quitBtn">
            <img src="assets/images/Lopeta.png" alt="Lopeta peli">
        </button>
    </div>

    <div id="gameOver" hidden> <!-- PELI PÄÄTTYI -->
        <button id="restartBtn">
            <img src="assets/images/Uudelleen.png" alt="Pelaa uudelleen">
        </button>
        <button id="menuBtn">
            <img src="assets/images/Valikko.png" alt="Takaisin valikkoon">
        </button>
    </div>
    <div id="playfield"></div> <!-- PELIKENTTÄ-->
    <script src="game.js"></script> <!-- script viimeiseksi, jotta playfield on jo olemassa -->
</body>

</html>
